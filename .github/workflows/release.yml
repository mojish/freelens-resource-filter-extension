name: Release

# Tag-driven release: push a v* tag to publish to npm and create a GitHub
# release with the packed tarball attached. Requires the NPM_TOKEN secret.
on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify (type-check, build, test, pack)
        run: pnpm verify

      # Fails with ENEEDAUTH before the publish step if NPM_TOKEN is missing
      # or invalid — much clearer than the publish error alone.
      - name: Check npm auth
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release with tarball
        uses: softprops/action-gh-release@v3
        with:
          files: "*.tgz"
          generate_release_notes: true
